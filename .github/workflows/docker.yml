name: Docker Image CI

# Builds the self-contained Dockerfile (frontend + backend) for linux/amd64
# and pushes the result to Docker Hub: toithichcakhia/s-ui. Runs only when a
# GitHub Release is published (or on manual dispatch), so a plain push does
# not build or publish another image.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKER_HUB_USERNAME  - your Docker Hub username
#   DOCKER_HUB_TOKEN     - a Docker Hub access token (not your password)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (optional), e.g. test"
        required: false
        default: ""

# This workflow only pushes an image; it never writes to the repository.
permissions:
  contents: read

env:
  IMAGE: toithichcakhia/s-ui

jobs:
  build-and-push:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The Dockerfile builds the frontend from frontend/, which is a
          # submodule, so fetch it recursively.
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Docker Hub no longer auto-creates repositories on push. Create it
      # here (idempotently) so a fresh fork can publish on the first try.
      - name: Ensure Docker Hub repository exists
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          set -e
          USER="$DOCKER_HUB_USERNAME"
          REPO="s-ui"

          # IMAGE below is hardcoded to toithichcakhia/s-ui; a different login
          # account would silently push to the wrong namespace (or fail).
          if [ "$USER" != "toithichcakhia" ]; then
            echo "DOCKER_HUB_USERNAME must be 'toithichcakhia' for image toithichcakhia/s-ui, got '$USER'" >&2
            exit 1
          fi

          JWT=$(curl -fsS -X POST https://hub.docker.com/v2/auth/token \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg u "$USER" --arg s "$DOCKER_HUB_TOKEN" '{identifier:$u, secret:$s}')" \
            | jq -r '.access_token')
          [ -n "$JWT" ] || { echo "Could not get a Docker Hub token" >&2; exit 1; }

          if curl -fsS -o /dev/null "https://hub.docker.com/v2/repositories/${USER}/${REPO}/"; then
            echo "Repository ${USER}/${REPO} already exists"
            exit 0
          fi

          PAYLOAD=$(jq -nc --arg n "$REPO" --arg ns "$USER" \
            '{name:$n, namespace:$ns, description:"s-ui panel image", is_private:false, registry:"docker.io"}')

          echo "Creating repository ${USER}/${REPO}"
          CODE=$(curl -sS -o /tmp/hub-create.json -w '%{http_code}' \
            -X POST "https://hub.docker.com/v2/namespaces/${USER}/repositories" \
            -H "Authorization: Bearer ${JWT}" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -d "$PAYLOAD")
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "Modern API returned HTTP $CODE, trying legacy endpoint" >&2
            CODE=$(curl -sS -o /tmp/hub-create.json -w '%{http_code}' \
              -X POST "https://hub.docker.com/v2/repositories/" \
              -H "Authorization: JWT ${JWT}" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -d "$PAYLOAD")
          fi
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "Failed to create repository (HTTP $CODE):" >&2
            cat /tmp/hub-create.json >&2 || true
            exit 1
          fi
          echo "Repository ${USER}/${REPO} created"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name || github.ref_name }},enable=${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
