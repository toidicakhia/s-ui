name: Docker Image CI

# Builds the self-contained Dockerfile (frontend + backend) for linux/amd64
# and pushes the result to the Docker Hub repository configured below.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKER_HUB_USERNAME  - your Docker Hub username
#   DOCKER_HUB_TOKEN     - a Docker Hub access token (not your password)
on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (optional), e.g. test"
        required: false
        default: ""

# This workflow only pushes an image; it never writes to the repository.
permissions:
  contents: read

env:
  IMAGE: toidicakhia/s-ui

jobs:
  build-and-push:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The Dockerfile builds the frontend from frontend/, which is a
          # submodule, so fetch it recursively.
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
